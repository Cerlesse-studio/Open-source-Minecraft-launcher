[package]
name = "open-source-minecraft-launcher"
version = "0.0.7"
description = "Open-source-Minecraft-launcher — an open-source Minecraft launcher"
authors = ["you"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "open_source_minecraft_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `gzip`/`deflate` matter for the Modrinth API: its version lists are
# uncompressed JSON of over a megabyte, and compressing them cuts load time
# by roughly 10x on slow links.
#
# TLS backend is chosen per platform (see the `[target.*.dependencies]` tables
# below).
# Native roots matter: Microsoft's update delivery (fe3.delivery.mp.microsoft.com,
# which serves UWP packages) chains to `Microsoft Root Certificate Authority
# 2011`, a root that only lives in the OS store — never in webpki-roots.
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "process", "net", "macros", "rt-multi-thread"] }
sha1 = "0.10"
md-5 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
base64 = "0.22"

# Windows uses Schannel (the OS certificate store) instead of rustls. That keeps
# the Windows build free of any C toolchain: rustls pulls `ring`, whose build
# script compiles C with `cl.exe` and fails when the host has no Visual Studio
# Build Tools, or when security software blocks the compiler writing into the
# project tree. Schannel also trusts Microsoft's update roots, which is exactly
# what the UWP/Microsoft Store download paths need.
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls", "gzip", "deflate"] }

# Every other platform keeps rustls with the native root store.
[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "gzip", "deflate"] }


# Read the optimization guideline for more details:
# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
